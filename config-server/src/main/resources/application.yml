server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/sangayyeshi/bank-config-repo.git
          default-label: main

security:
  user:
    name: ${CONFIG_SERVER_USERNAME:config-admin}
    password: ${CONFIG_SERVER_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/