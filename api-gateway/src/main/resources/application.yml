spring:
  application:
    name: api-gateway

  config:
    import:  optional :configserver:http://localhost:8888
    # port 8888 the config server where we used for confi
server:
  port: 8080


  cloud:
    gateway:
      routes:


        # AUTH SERVICE
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**



        # ACCOUNT SERVICE
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**



        # TRANSACTION SERVICE
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka



management:
  endpoints:
    web:
      exposure:
        include: "*"